<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер нотаток</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img src="assets/img/logo.jpg" alt="Логотип Менеджер нотаток">
        <h1>Менеджер нотаток</h1>
    </header>

    <main>
        <section id="new-note">
            <h2>Нова нотатка</h2>
            <form action="#" method="post" id="noteForm">
                <div>
                    <label for="noteTitle">Заголовок:</label>
                    <input type="text" id="noteTitle" name="noteTitle" required>
                </div>
                <div>
                    <label for="noteContent">Зміст:</label>
                    <textarea id="noteContent" name="noteContent" required></textarea>
                </div>

                <button type="submit">Додати нотатку</button>
            </form>
        </section>

        <section id="note-list">
            <h2>Список нотаток</h2>
            <article class="note-card">
                <h3>Заголовок нотатки</h3>
                <p>Уривок нотатки...</p>
            </article>
        </section>
        
        
    </main>

    <aside id="note-view">
        <h2>Перегляд нотатки</h2>
        <article class="note-view">
            <h3>Заголовок нотатки</h3>
            <p>Повний зміст нотатки...</p>
            <p>Зроблено: 2026-10-10</p>
        </article>
    </aside>

    <footer>
        <p>&copy; 2026 Менеджер нотаток. Всі права захищені.</p>
    </footer>

    <!-- Заплановані розділи: 
    шапка з назвою; форма створення нотатки;
    список нотаток (картки із заголовком і уривком); 
    блок перегляду
    обраної нотатки повністю; підвал. -->




    <script src="js/app.js"></script>
</body>
</html>
